name: snake

on:
  schedule:
    - cron: "0 */12 * * *"   # tu chay 12 tieng/lan
  workflow_dispatch:          # cho phep bam chay tay o tab Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sinh anh con ran tu bieu do contribution
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23ff69b4&color_dots=%23161b22,%23ffd6ec,%23ff9ff3,%23ff5fa2,%23ff1493
            dist/snake-dark.svg?palette=github-dark&color_snake=%23ff69b4&color_dots=%23161b22,%23ffd6ec,%23ff9ff3,%23ff5fa2,%23ff1493

      - name: Day anh sang nhanh output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
